<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff3f6">
  <meta name="description" content="A little interactive love story, made just for Malu.">
  <title>For Malu, with love 💗</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <main class="app" aria-live="polite">
    <header class="topbar">
      <div class="tiny-heart" aria-hidden="true">♡</div>
      <div class="progress-wrap" aria-label="Story progress"><div class="progress" id="progress"></div></div>
      <span class="page-count" id="pageCount">01 / 09</span>
    </header>

    <section class="story-card" id="storyCard">
      <div class="sparkle sparkle-a" aria-hidden="true">✦</div>
      <div class="sparkle sparkle-b" aria-hidden="true">✧</div>
      <div class="eyebrow" id="eyebrow">A little something for you</div>
      <div class="illustration" id="illustration" aria-hidden="true">💌</div>
      <h1 id="title">Hey, Malu…</h1>
      <div class="copy" id="copy"></div>
      <div class="memory-note" id="note"></div>
      <div class="heart-row" aria-hidden="true">♡　♥　♡</div>
      <div class="actions" id="actions"></div>
    </section>
    <footer>Made with all my heart, by <span>Ichaa</span> <span class="footer-heart">♥</span></footer>
  </main>
  <div class="confetti-layer" id="confetti" aria-hidden="true"></div>
  <script src="script.js"></script>
</body>
</html>
